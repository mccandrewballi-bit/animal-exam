function save(){try{localStorage.setItem(EXAM_KEY,JSON.stringify(current));localStorage.setItem(HISTORY_KEY,JSON.stringify(history));localStorage.setItem('animal_recovery_snapshot_v3',JSON.stringify({exam:current,history,favorites,at:Date.now()}));}catch(e){alert('本地保存失败！请立即点击“下载数据备份”，避免记录丢失。')}}

// 数据保护：文件备份不依赖浏览器来源地址；同一个 HTML 文件换路径也能通过 JSON 恢复。
const BACKUP_VERSION=3;
function fullBackup(){return {version:BACKUP_VERSION,createdAt:new Date().toISOString(),exam:current,history,favorites,drill:JSON.parse(localStorage.getItem('animal_drill_v1')||'{}'),practice:localStorage.getItem('animal_practice_answers'),practiceLegacy:localStorage.getItem('animal_answers_v1')}}
function downloadBackup(){const blob=new Blob([JSON.stringify(fullBackup(),null,2)],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='动物检疫_学习数据备份_'+new Date().toISOString().slice(0,10)+'_'+Date.now()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}
function recoverSnapshot(){try{if(history.length)return;const snap=JSON.parse(localStorage.getItem('animal_recovery_snapshot_v3')||'null');if(snap&&Array.isArray(snap.history)&&snap.history.length){history=snap.history;if(!current)current=snap.exam||null;if(!favorites.length&&Array.isArray(snap.favorites))favorites=snap.favorites;save()}}catch(e){}}
recoverSnapshot();
function mergeBackup(d){if(!d||!Array.isArray(d.history))throw Error('不是有效的学习记录备份');const byId=new Map();for(const r of [...history,...d.history]){if(r&&r.id!==undefined)byId.set(String(r.id),r)}history=[...byId.values()].sort((a,b)=>(b.finishedAt||b.id||0)-(a.finishedAt||a.id||0));favorites=[...new Set([...favorites,...(Array.isArray(d.favorites)?d.favorites:[])])];if(!current&&d.exam)current=d.exam;const oldDrill=JSON.parse(localStorage.getItem('animal_drill_v1')||'{}');localStorage.setItem('animal_drill_v1',JSON.stringify({...d.drill,...oldDrill}));if(!localStorage.getItem('animal_practice_answers')&&d.practice)localStorage.setItem('animal_practice_answers',d.practice);localStorage.setItem('animal_favorites_v1',JSON.stringify(favorites));history.forEach(regradeRecord);if(current?.finished)regradeRecord(current);save();}
const backupBar=document.createElement('div');backupBar.className='result';backupBar.style.margin='12px auto';backupBar.style.maxWidth='1000px';backupBar.style.padding='12px 16px';backupBar.innerHTML='<strong>💾 学习数据保护</strong> <span class="muted">换文件或浏览器可能读不到旧数据。每次交卷请下载 JSON 备份，下一版可导入合并。</span> ';
const backupBtn=document.createElement('button');backupBtn.className='primary';backupBtn.textContent='⬇ 下载数据备份';backupBtn.onclick=downloadBackup;
const restoreBtn=document.createElement('button');restoreBtn.textContent='⬆ 导入并合并旧数据';const restoreInput=document.createElement('input');restoreInput.type='file';restoreInput.accept='.json,application/json';restoreInput.hidden=true;restoreBtn.onclick=()=>restoreInput.click();restoreInput.onchange=async()=>{try{if(!restoreInput.files?.length)return;const d=JSON.parse(await restoreInput.files[0].text());if(!confirm('将备份中的考试记录与当前记录合并（同一考试不会重复），是否继续？'))return;mergeBackup(d);alert('恢复成功：目前共 '+history.length+' 次考试记录。');setMode('wrong')}catch(e){alert('恢复失败：'+e.message)}finally{restoreInput.value=''}};
backupBar.append(backupBtn,restoreBtn,restoreInput);document.querySelector('.modebar').after(backupBar);
// 修复旧版判断题评分：依据原始作答重新核算成绩及独立错题集。
function regradeRecord(r){
 if(!r||!r.finished||!Array.isArray(r.items)||!r.answers)return false;
 const lookup=new Map(DATA.map(x=>[x.section+'-'+x.n,x]));
 let wrong=[],score=0;
 for(const k of r.items){const x=lookup.get(k);if(!x)continue;
  let given=r.answers[k]||[];if(!Array.isArray(given))given=[given];given=given.slice().sort();
  if(same(given,letters(x)))score++;else wrong.push({key:k,given});
 }
 const changed=r.score!==score||JSON.stringify(r.wrong||[])!==JSON.stringify(wrong);
 if(changed){r.score=score;r.wrong=wrong;r.gradingFix='judge-v1'}return changed;
}
function repairSavedResults(){
 let changed=false;
 if(current&&current.finished)changed=regradeRecord(current)||changed;
 history.forEach(r=>{changed=regradeRecord(r)||changed});
 if(changed)save();
}

function setMode(mode){practice.hidden=mode!=='practice';examView.hidden=mode!=='exam';wrongView.hidden=mode!=='wrong';for(const [k,b] of Object.entries(tabs))b.classList.toggle('active',k===mode);if(mode==='exam')renderExam();if(mode==='wrong')renderHistory();window.scrollTo(0,0)}
for(const [k,b] of Object.entries(tabs))b.addEventListener('click',()=>setMode(k));
const key=x=>x.section+'-'+x.n;
const letters=x=>{if(x.section.includes('判断')){const a=String(x.answer).trim();return ['√','✓','✔','对','正确'].includes(a)?['A']:['×','✕','✖','x','X','错','错误'].includes(a)?['B']:[]}return (String(x.answer).match(/[A-E]/g)||[]).sort()};
const displayAnswer=x=>x.section.includes('判断')?(letters(x)[0]==='A'?'A. 正确（√）':'B. 错误（×）'):x.answer;
const same=(a,b)=>a.length===b.length&&a.every((v,i)=>v===b[i]);
const fmt=ms=>{let t=Math.max(0,Math.ceil(ms/1000));return `${String(Math.floor(t/3600)).padStart(2,'0')}:${String(Math.floor(t%3600/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`};
function shuffled(arr){let a=[...arr];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function selectExamItems(){
 const pool=shuffled(DATA);if(focusMode==='coverage'){
 const seen=new Map();history.forEach(r=>(r.items||[]).forEach(k=>seen.set(k,(seen.get(k)||0)+1)));
 pool.sort((a,b)=>(seen.get(key(a))||0)-(seen.get(key(b))||0));
 }else if(focusMode==='weak'){
 const bad=new Map();history.forEach(r=>(r.wrong||[]).forEach(w=>bad.set(w.key,(bad.get(w.key)||0)+1)));
 pool.sort((a,b)=>(bad.get(key(b))||0)-(bad.get(key(a))||0));
 }return pool.slice(0,COUNT).map(key)
}
function newExam(){if(current&&!current.finished&&!confirm('当前考试尚未交卷。确定放弃当前试卷并重新随机组题吗？'))return;current={id:Date.now(),started:Date.now(),items:selectExamItems(),answers:{},finished:false};save();setMode('exam')}
function finish(auto=false){if(!current||current.finished)return;let answered=Object.values(current.answers).filter(a=>a.length).length;if(!auto&&answered<COUNT&&!confirm(`还有 ${COUNT-answered} 道题未作答，未答题计0分。确定交卷吗？`))return;
const lookup=new Map(DATA.map(x=>[key(x),x]));let wrong=[],correctCount=0;for(const k of current.items){const x=lookup.get(k),given=(current.answers[k]||[]).slice().sort();if(same(given,letters(x)))correctCount++;else wrong.push({key:k,given})}
current.finished=true;current.finishedAt=Date.now();current.auto=auto;current.score=correctCount;current.wrong=wrong;history.unshift(JSON.parse(JSON.stringify(current)));save();setTimeout(()=>{if(confirm("本次考试已保存到当前浏览器。为防止换文件后丢失，建议立即下载一份独立JSON备份。现在下载吗？"))downloadBackup()},300);clearInterval(timer);timer=null;renderExam();}
function updateTimer(){if(!current||current.finished)return;let left=current.started+DURATION-Date.now();const e=document.getElementById('examClock');if(e)e.textContent=fmt(left);if(left<=0)finish(true)}
function makeCard(x,index,given,readonly=false){let article=document.createElement('article');article.className='card examcard';let multi=x.section.includes('多项');let h=document.createElement('div');h.className='top';h.innerHTML=`<span class="tag"></span><span class="small">第 ${index} / 100 题 · ${x.section.includes('判断')?'判断':multi?'多选':'单选'}</span>`;h.querySelector('.tag').textContent=x.section;article.appendChild(h);
let mark=document.createElement('button');mark.textContent=favorites.includes(key(x))?'★ 已收藏':'☆ 收藏';mark.style.marginLeft='auto';mark.onclick=()=>{const k=key(x);favorites=favorites.includes(k)?favorites.filter(t=>t!==k):[...favorites,k];localStorage.setItem('animal_favorites_v1',JSON.stringify(favorites));mark.textContent=favorites.includes(k)?'★ 已收藏':'☆ 收藏'};h.appendChild(mark);
if(!readonly){let flag=document.createElement('button');flag.textContent=(current.flags||[]).includes(key(x))?'🚩 已标记':'🚩 标记';flag.onclick=()=>{current.flags=current.flags||[];const k=key(x);current.flags=current.flags.includes(k)?current.flags.filter(t=>t!==k):[...current.flags,k];save();flag.textContent=current.flags.includes(k)?'🚩 已标记':'🚩 标记'};h.appendChild(flag)}
let q=document.createElement('div');q.className='question';q.textContent=index+'. '+x.q;article.appendChild(q);
for(const [letter,content] of Object.entries(x.options)){let label=document.createElement('label');label.className='option examchoice';let input=document.createElement('input');input.type=multi?'checkbox':'radio';input.name='exam_'+index;input.value=letter;input.checked=given.includes(letter);input.disabled=readonly;let txt=document.createElement('span');txt.textContent=letter+'. '+content;label.append(input,txt);article.appendChild(label);if(!readonly){input.addEventListener('change',()=>{let a=multi?new Set(current.answers[key(x)]||[]):new Set();if(input.checked)a.add(letter);else a.delete(letter);current.answers[key(x)]=[...a].sort();save();label.parentElement.querySelectorAll('.examchoice').forEach(l=>l.classList.toggle('selected',l.querySelector('input').checked));let done=current.items.filter(k=>(current.answers[k]||[]).length).length;document.getElementById('examDone').textContent=done+' / 100 已答';})}}
if(readonly){let div=document.createElement('div');let isCorrect=same(given,letters(x));div.className=isCorrect?'correct-answer':'wrong-answer';div.textContent=`${isCorrect?'✓ 正确':'✕ 错误'}｜你的答案：${given.join('、')||'未作答'}｜题库答案：${displayAnswer(x)}`;article.appendChild(div)}return article}
function renderExam(){clearInterval(timer);timer=null;examView.replaceChildren();if(!current){examView.innerHTML='<div class="result"><h2>随机模拟考试</h2><p>每次从原题库随机抽取 <b>100 题</b>，满分 <b>100 分</b>，考试时间 <b>90 分钟</b>。单选、判断、多选按原题型作答；每题1分，多选必须完全匹配才得分。</p><p>考试期间不显示答案；交卷或倒计时结束后自动评分，并生成本次独立错题集。</p><button class="primary" id="startExam">开始随机组题</button></div>';let chooser=document.createElement('select');chooser.innerHTML='<option value="random">完全随机组题</option><option value="coverage">优先未练习题</option><option value="weak">优先历史错题</option>';chooser.value=focusMode;chooser.onchange=()=>focusMode=chooser.value;document.getElementById('startExam').before(chooser);document.getElementById('startExam').onclick=newExam;return}
if(!current.finished&&Date.now()>=current.started+DURATION){finish(true);return}
let lookup=new Map(DATA.map(x=>[key(x),x]));let head=document.createElement('div');head.className='examhead';let title=document.createElement('strong');title.textContent=current.finished?'本次考试成绩':'模拟考试进行中';head.appendChild(title);
if(current.finished){let score=document.createElement('span');score.className='pill';score.textContent=`得分 ${current.score} / 100 · 错题 ${current.wrong.length} 道`;head.appendChild(score);let btn=document.createElement('button');btn.className='primary';btn.textContent='再组一套100题';btn.onclick=newExam;head.appendChild(btn);let wb=document.createElement('button');wb.textContent='查看历次错题集';wb.onclick=()=>setMode('wrong');head.appendChild(wb);let note=document.createElement('div');note.className='muted';note.textContent=current.auto?'考试时间已到，系统自动交卷。':'已交卷并自动保存本次错题集。';examView.appendChild(note)}
else{let clock=document.createElement('span');clock.className='pill';clock.innerHTML='剩余 <b id="examClock"></b>';head.appendChild(clock);let done=document.createElement('span');done.id='examDone';done.className='pill';done.textContent=current.items.filter(k=>(current.answers[k]||[]).length).length+' / 100 已答';head.appendChild(done);let submit=document.createElement('button');submit.className='primary';submit.textContent='提交试卷并评分';submit.onclick=()=>finish(false);head.appendChild(submit);let flagged=document.createElement('button');flagged.textContent='🚩 跳到标记题';flagged.onclick=()=>{let k=(current.flags||[])[0];if(!k){alert('暂无标记题');return}let ix=current.items.indexOf(k);examView.querySelectorAll('.examcard')[ix]?.scrollIntoView({behavior:'smooth'})};head.appendChild(flagged);let reset=document.createElement('button');reset.textContent='重新组题';reset.onclick=newExam;head.appendChild(reset)}
examView.prepend(head);let frag=document.createDocumentFragment();current.items.forEach((k,i)=>{let x=lookup.get(k);if(x)frag.appendChild(makeCard(x,i+1,current.answers[k]||[],current.finished))});examView.appendChild(frag);if(current.finished){let report=document.createElement('div');report.className='result';let total=current.items.length;let elapsed=Math.round(((current.finishedAt||Date.now())-current.started)/60000);report.innerHTML=`<h3>成绩分析</h3><p>得分：${current.score}/${total} · 用时：${elapsed}分钟 · 错题及未答：${current.wrong.length}道 · 标记题：${(current.flags||[]).length}道</p>`;examView.insertBefore(report,examView.querySelector('.examcard'))}if(!current.finished){updateTimer();timer=setInterval(updateTimer,1000)}}
function renderHistory(){wrongView.replaceChildren();let h=document.createElement('div');h.className='result';h.innerHTML='<h2>历次考试 · 独立错题集</h2><p class="muted">每次交卷自动生成一份错题集，包含答错和未作答的题目。记录保存在当前浏览器本地，建议定期导出备份。</p>';let exp=document.createElement('button');exp.textContent='导出全部考试记录 JSON';exp.onclick=()=>{let blob=new Blob([JSON.stringify(history,null,2)],{type:'application/json;charset=utf-8'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='动物检疫检验员_考试与错题记录.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};h.appendChild(exp);wrongView.appendChild(h);if(!history.length){let p=document.createElement('p');p.textContent='暂无考试记录。完成一次模拟考试后，错题集将自动出现在这里。';wrongView.appendChild(p);return}
for(let i=0;i<history.length;i++){let record=history[i];let row=document.createElement('div');row.className='historyrow';let label=document.createElement('div');let d=new Date(record.finishedAt||record.id);label.innerHTML=`<b>第 ${history.length-i} 次考试</b><br><span class="muted">${d.toLocaleString('zh-CN')} · ${record.score}/100 分 · ${record.wrong.length} 道错题</span>`;let actions=document.createElement('div');let btn=document.createElement('button');btn.className='primary';btn.textContent='展开本次错题';let panel=document.createElement('div');panel.style.display='none';btn.onclick=()=>{if(panel.style.display==='none'){panel.style.display='block';btn.textContent='收起错题';panel.replaceChildren();if(!record.wrong.length){panel.textContent='本次考试满分，没有错题。'}else{let lookup=new Map(DATA.map(x=>[key(x),x]));record.wrong.forEach((w,j)=>{let x=lookup.get(w.key);if(x)panel.appendChild(makeCard(x,j+1,w.given||[],true))})}}else{panel.style.display='none';btn.textContent='展开本次错题'}};let del=document.createElement('button');del.textContent='删除本次记录';del.onclick=()=>{if(confirm('确定删除本次考试及其错题集吗？')){history.splice(i,1);save();renderHistory()}};actions.append(btn,del);row.append(label,actions);wrongView.append(row,panel)}}

// 五天冲刺：兼容旧版考试与练习记录
const sprint=document.getElementById('sprintView'),sprintBtn=document.createElement('button');sprintBtn.textContent='🔥 考前冲刺';sprintBtn.id='sprintTab';document.querySelector('.modebar').appendChild(sprintBtn);
const oldSetMode=setMode;setMode=function(mode){oldSetMode(mode==='sprint'?'practice':mode);if(mode==='sprint'){practice.hidden=true;examView.hidden=true;wrongView.hidden=true;sprint.hidden=false;Object.values(tabs).forEach(b=>b.classList.remove('active'));sprintBtn.classList.add('active');renderSprint()}else{sprint.hidden=true;sprintBtn.classList.remove('active')}};
sprintBtn.onclick=()=>setMode('sprint');
function statsData(){let seen=new Set(),wrong=new Map();history.forEach(r=>{(r.items||[]).forEach(k=>seen.add(k));(r.wrong||[]).forEach(w=>wrong.set(w.key,(wrong.get(w.key)||0)+1))});return {seen,wrong}}
function renderSprint(){const {seen,wrong}=statsData();let highest=history.length?Math.max(...history.map(r=>r.score||0)):'—';document.getElementById('sprintStats').innerHTML=`<div class="stats"><div class="pill">题库 ${DATA.length} 题</div><div class="pill">模拟考试 ${history.length} 次</div><div class="pill">已覆盖 ${seen.size} 题</div><div class="pill">未覆盖 ${DATA.length-seen.size} 题</div><div class="pill">历史错题 ${wrong.size} 题</div><div class="pill">收藏 ${favorites.length} 题</div><div class="pill">最高分 ${highest}</div></div>`}
function drill(mode){const {seen,wrong}=statsData();let arr=DATA.filter(x=>mode==='wrong'?wrong.has(key(x)):mode==='fav'?favorites.includes(key(x)):!seen.has(key(x)));if(mode==='wrong')arr.sort((a,b)=>wrong.get(key(b))-wrong.get(key(a)));const box=document.getElementById('drillCards');box.replaceChildren();if(!arr.length){box.textContent='当前没有符合条件的题目。';return}let title=document.createElement('div');title.className='result';title.textContent=`本次专项练习：${arr.length}道。每题作答后点击“核对答案”，不会影响模拟考试成绩。`;box.append(title);arr.forEach((x,i)=>{let card=document.createElement('article');card.className='card';let heading=document.createElement('div');heading.className='question';heading.textContent=`${i+1}. ${x.q}（原题号 ${x.n}）`;card.append(heading);let multi=x.section.includes('多项'),choices=[];for(let [k,v] of Object.entries(x.options)){let lab=document.createElement('label');lab.className='option';let input=document.createElement('input');input.type=multi?'checkbox':'radio';input.name='drill_'+i;input.value=k;input.onchange=()=>{if(!multi)choices=[k];else choices=[...card.querySelectorAll('input:checked')].map(z=>z.value)};lab.append(input,document.createTextNode(k+'. '+v));card.append(lab)}let btn=document.createElement('button');btn.textContent='核对答案';let out=document.createElement('div');btn.onclick=()=>{let ok=same(choices.slice().sort(),letters(x));out.className=ok?'correct-answer':'wrong-answer';out.textContent=`${ok?'✓ 正确':'✕ 错误'}｜正确答案：${displayAnswer(x)}`;let dr=JSON.parse(localStorage.getItem('animal_drill_v1')||'{}');dr[key(x)]={correct:ok,at:Date.now()};localStorage.setItem('animal_drill_v1',JSON.stringify(dr))};card.append(btn,out);box.append(card)})}
document.getElementById('weakDrill').onclick=()=>drill('wrong');document.getElementById('favDrill').onclick=()=>drill('fav');document.getElementById('unseenDrill').onclick=()=>drill('unseen');
document.getElementById('exportAll').onclick=downloadBackup;
document.getElementById('importAll').onclick=()=>restoreInput.click();


repairSavedResults();
if(current&&!current.finished&&Date.now()>=current.started+DURATION)finish(true);
})();
</script></body></html>
